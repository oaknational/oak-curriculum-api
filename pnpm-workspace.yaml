auditConfig:
  ignoreGhsas:
    # decompress advisories reachable only via Sanity's dev-time CLI
    # (@sanity/cli). No upstream fix available; not used at runtime.
    - GHSA-mp2f-45pm-3cg9 # critical: extraction outside target dir
    - GHSA-h39j-r5qq-r9mm # moderate: arbitrary file write (Zip Slip)
    - GHSA-jwp9-9v96-94mx # moderate: arbitrary hardlink creation
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  core-js: true
  core-js-pure: true
  esbuild: true
  prisma: true
  sharp: true
  tree-sitter: true
  tree-sitter-json: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - decompress@4.2.2
  - '@posthog/core@1.48.6'
  - posthog-js@1.418.5
overrides:
  conventional-changelog-conventionalcommits@<9.3.1: 9.3.1
  # high: glob CLI command injection via -c/--cmd (GHSA-5j98-mcp5-4vw2),
  # pulled in by @sanity/cli's @architect/* dev-time tooling.
  glob@>=10.2.0 <10.5.0: ^10.5.0
  # high: crafted ZIP triggers a 4GB allocation (GHSA-xcpc-8h2w-3j85),
  # via @sanity/cli.
  adm-zip@<0.6.0: ^0.6.0
  fast-uri@<3.1.6: ^3.1.6
  uuid@<11.1.1: ^11.1.1
  qs@<6.16.0: ^6.16.0
  prismjs@<1.27.0: ^1.30.0
