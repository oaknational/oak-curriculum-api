name: Link Check

# Documentation that points at files someone deleted is one of the fastest ways
# for a public repository's front page to go stale. Check every Markdown link,
# on every pull request that touches documentation, and weekly against the live
# site so external links that rot are caught too.
on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/workflows/link-check.yml"
  schedule:
    # 07:00 UTC every Monday.
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  link-check:
    name: link-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate link-check token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          args: >-
            --no-progress
            --include-fragments
            --exclude-path node_modules
            --exclude-path CHANGELOG.md
            --exclude '^https://console\.upstash\.com'
            --exclude '^https://.*\.hsforms\.com'
            --exclude '^http://localhost'
            --exclude '^https://github\.com/oaknational/'
            --exclude '^https://app\.notion\.com/p/oaknationalacademy/'
            --accept 200,206,403,429
            './**/*.md'
          output: lychee-report.md
          fail: true

      - name: Publish report
        if: always()
        run: cat lychee-report.md >> "$GITHUB_STEP_SUMMARY" || true
