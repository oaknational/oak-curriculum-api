name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

# A release pushes back to main; never run two at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest

    steps:
      # semantic-release pushes the release commit to main, which is protected.
      # GITHUB_TOKEN cannot do that, so we mint a token for a GitHub App that is
      # on the branch-protection bypass list. See docs/RELEASING.md.
      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          # semantic-release needs the full history and tags to work out what
          # has already been released.
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # Fetch the pnpm binary directly instead of via `npm install`, which has
        # stalled for minutes on the npm registry/audit endpoint during setup.
        with:
          standalone: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # The release commit body is the generated release notes, whose
          # changelog lines run well past commitlint's body-max-line-length.
          # Skip the husky hooks rather than lint a machine-written commit.
          HUSKY: 0

      - name: Summarise the release
        if: always()
        run: |
          {
            echo "### Release"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo "See the [releases page](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases) for what was published, if anything."
            echo
            echo "Only commits scoped \`api\` produce a release — see \`.releaserc.json\`."
          } >> "$GITHUB_STEP_SUMMARY"
